server:
	# bancuh-dns talks to this recursor on 127.0.0.1:5353. Nothing else needs to
	# reach it, so unlike the previous BIND config (which listened on any address
	# with recursion allowed from anywhere) this only binds loopback.
	interface: 127.0.0.1
	port: 5353
	access-control: 0.0.0.0/0 refuse
	access-control: 127.0.0.0/8 allow

	do-ip4: yes
	do-ip6: no
	do-udp: yes
	do-tcp: yes

	# run in the foreground as root inside the container; bancuh-dns supervises
	# the process and kills it on shutdown
	username: ""
	chroot: ""
	directory: "/etc/unbound"
	pidfile: ""
	use-syslog: no
	logfile: ""
	verbosity: 0

	# DNSSEC validation. BIND validated by default; unbound does NOT without an
	# explicit anchor, so this is required to avoid silently failing open.
	# The image primes root.key with unbound-anchor at build time, and unbound
	# keeps it current at runtime per RFC 5011.
	auto-trust-anchor-file: "/etc/unbound/root.key"

	# Cache sizing. These bound cached data only: real RSS lands around 1.5x their
	# sum once per-entry overhead, the infra/key caches and allocator fragmentation
	# are counted. 64m + 192m (which mirrored named.conf's max-cache-size 256m) grew
	# unbound to ~380MB on the busiest hosts, against 16-55MB for the BIND it
	# replaced -- BIND treated that number as a soft target and never approached it,
	# unbound genuinely fills its allocation. On a 1GB host that left ~120MB
	# available, too little to absorb the memory the daily blocklist compile needs.
	#
	# 32m + 64m puts unbound near 150MB. cache-max-ttl is 600s, so entries are
	# short-lived and the smaller cache costs little hit rate.
	msg-cache-size: 32m
	rrset-cache-size: 64m
	cache-max-ttl: 600
	cache-max-negative-ttl: 600
	prefetch: yes

	# two threads, with slab counts matched to thread count (must be powers of 2)
	num-threads: 2
	msg-cache-slabs: 2
	rrset-cache-slabs: 2
	infra-cache-slabs: 2
	key-cache-slabs: 2
	so-reuseport: yes

	hide-identity: yes
	hide-version: yes
	qname-minimisation: yes
