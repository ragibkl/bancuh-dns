name: Bancuh DNS Docker Image CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # check, then smoke, must pass before the images are pushed, so a broken
  # commit on master never reaches the `2` tag the DNS nodes pull.
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Use the same Rust version as .tool-versions, so local checks and CI agree.
      - name: Read Rust version
        id: rust
        run: echo "version=$(awk '$1 == "rust" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy

      - name: Dockerfile Rust matches .tool-versions
        run: |
          docker_rust=$(sed -nE 's/^FROM rust:([0-9.]+)-alpine.* AS builder$/\1/p' Dockerfile)
          echo "Dockerfile rust:$docker_rust, .tool-versions ${{ steps.rust.outputs.version }}"
          test "$docker_rust" = "${{ steps.rust.outputs.version }}"

      - name: cargo fmt
        run: cargo fmt --check

      - name: Security advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      # rocksdb's C++ build is the slow part; cache it between runs.
      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  # Build the amd64 image without pushing it, start it with the tiny config in
  # tests/smoke and check real DNS answers. Shares its build cache with the
  # amd64 leg of the build job.
  smoke:
    needs: check
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bancuh-dns:smoke
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,scope=linux-amd64,mode=max
          pull: true

      - name: Smoke test
        run: tests/smoke/run.sh bancuh-dns:smoke

  # One native runner per platform (no emulation), each pushing its image by
  # digest; the merge job then publishes the multi-arch tags.
  build:
    needs: smoke
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ragibkl/bancuh-dns,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max
          pull: true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ragibkl/bancuh-dns
          tags: |
            # default setups
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            # set 2 tag for master branch
            type=raw,value=2,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ragibkl/bancuh-dns@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ragibkl/bancuh-dns:${{ steps.meta.outputs.version }}
