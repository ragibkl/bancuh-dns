name: Bancuh DNS Docker Image CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # Everything here must pass before an image is built, so a broken commit on
  # master never reaches the `2` tag the DNS nodes pull.
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Use the same Rust version as .tool-versions, so local checks and CI agree.
      - name: Read Rust version
        id: rust
        run: echo "version=$(awk '$1 == "rust" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --check

      - name: Security advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      # rocksdb's C++ build is the slow part; cache it between runs.
      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  build:
    needs: check
    runs-on: ubuntu-latest

    # Permissions to use OIDC token authentication
    permissions:
      contents: read
      id-token: write
      # Allows pushing to the GitHub Container Registry
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ragibkl/bancuh-dns
          tags: |
            # default setups
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            # set 2 tag for master branch
            type=raw,value=2,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}

      - uses: depot/setup-action@v1

      - uses: depot/build-push-action@v1
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64
          project: 83rwjkn7g4
          push: true
          tags: ${{ steps.meta.outputs.tags }}
