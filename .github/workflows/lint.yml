name: Lint

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Use the same Rust version as .tool-versions, so local checks and CI agree.
      - name: Read Rust version
        id: rust
        run: echo "version=$(awk '$1 == "rust" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --check

      # rocksdb's C++ build is the slow part; cache it between runs.
      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
